name: Babysit PR

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to babysit'
        required: true
        type: string
      retry_count:
        description: 'Internal: tracks mid-run re-dispatch attempts'
        required: false
        default: '0'
        type: string

jobs:
  babysit:
    # On pull_request_review: only fire on CodeRabbit reviews of non-draft PRs.
    # On workflow_dispatch: always run (pr_number input required).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.user.login == 'coderabbitai[bot]' &&
       github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'no-babysit'))
    runs-on: ubuntu-latest
    concurrency:
      group: babysit-pr-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install jq and perl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq perl

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Pre-flight rate limit check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          max_attempts=3
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            output=$(claude -p "ok" 2>&1) && { echo "Pre-flight OK."; exit 0; } || true
            if echo "$output" | grep -qi "hit your limit"; then
              reset_time=$(echo "$output" | grep -oP "resets \K\d+:\d+[ap]m")
              if [ -n "$reset_time" ]; then
                wait_secs=$(python3 -c "
          import re, datetime
          m = re.match(r'(\d+):(\d+)([ap]m)', '$reset_time')
          if m:
              h, mn, ampm = int(m.group(1)), int(m.group(2)), m.group(3)
              if ampm == 'pm' and h != 12: h += 12
              if ampm == 'am' and h == 12: h = 0
              now = datetime.datetime.utcnow()
              reset = now.replace(hour=h, minute=mn, second=0, microsecond=0)
              if reset <= now: reset += datetime.timedelta(days=1)
              wait = int((reset - now).total_seconds()) + 120
              print(max(0, min(wait, 7200)))
          else:
              print(3600)
          ")
                echo "Rate limited (attempt $attempt/$max_attempts). Sleeping ${wait_secs}s until ${reset_time} UTC..."
                sleep $wait_secs
              else
                echo "Rate limited (no reset time found). Sleeping 1h..."
                sleep 3600
              fi
            else
              echo "Pre-flight failed (non-rate-limit error): $output"
              exit 1
            fi
          done
          echo "Still rate limited after $max_attempts attempts. Failing."
          exit 1

      - name: Run babysit-pr
        id: babysit
        continue-on-error: true
        uses: anthropics/claude-code-action@855a15bff2f22a6b15d90a4ebef506b5f1da1aec # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: coderabbitai
          prompt: |
            Read `.agents/skills/babysit-pr/SKILL.md` and follow its instructions exactly for PR #${{ github.event.pull_request.number || inputs.pr_number }}.
          claude_args: |
            --allowedTools Bash,Read,Write,Edit
            --max-turns 80
            --model claude-sonnet-4-6
          track_progress: ${{ github.event_name == 'pull_request_review' }}
          show_full_output: true

      - name: Retry if rate-limited mid-run
        if: steps.babysit.outcome == 'failure' && (inputs.retry_count || '0') < '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BABYSIT_EXECUTION_FILE: ${{ steps.babysit.outputs.execution_file || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          RETRY_COUNT: ${{ inputs.retry_count || '0' }}
        run: |
          babysit_output=""
          if [ -n "$BABYSIT_EXECUTION_FILE" ] && [ -f "$BABYSIT_EXECUTION_FILE" ]; then
            babysit_output=$(cat "$BABYSIT_EXECUTION_FILE")
          fi

          if ! echo "$babysit_output" | grep -qi "hit your limit"; then
            echo "babysit-pr failed (not a rate limit). Failing job."
            exit 1
          fi

          reset_str=$(echo "$babysit_output" | grep -oP 'resets \K\d+:\d+[ap]m(?= \(UTC\))' | head -1)
          wait_s=$(python3 -c "
          import re, datetime
          m = re.match(r'(\d+):(\d+)([ap]m)', '${reset_str:-}')
          if m:
              h, mn, ap = int(m.group(1)), int(m.group(2)), m.group(3)
              if ap == 'pm' and h != 12: h += 12
              if ap == 'am' and h == 12: h = 0
              now = datetime.datetime.utcnow()
              reset = now.replace(hour=h, minute=mn, second=0, microsecond=0)
              if reset <= now: reset += datetime.timedelta(days=1)
              print(max(0, min(int((reset - now).total_seconds()) + 120, 7200)))
          else:
              print(3600)
          ")

          next_retry=$((RETRY_COUNT + 1))
          echo "Rate limited mid-run (attempt $((RETRY_COUNT + 1))/2). Sleeping ${wait_s}s, then re-triggering PR #${PR_NUMBER}."
          sleep "$wait_s"
          gh workflow run babysit-pr.yml --repo "$GITHUB_REPOSITORY" \
            --field pr_number="$PR_NUMBER" \
            --field retry_count="$next_retry"

      - name: Fail if mid-run retries exhausted
        if: steps.babysit.outcome == 'failure' && (inputs.retry_count || '0') >= '2'
        env:
          BABYSIT_EXECUTION_FILE: ${{ steps.babysit.outputs.execution_file || '' }}
        run: |
          babysit_output=""
          if [ -n "$BABYSIT_EXECUTION_FILE" ] && [ -f "$BABYSIT_EXECUTION_FILE" ]; then
            babysit_output=$(cat "$BABYSIT_EXECUTION_FILE")
          fi

          if echo "$babysit_output" | grep -qi "hit your limit"; then
            echo "babysit-pr rate-limited mid-run and retry limit (2) reached. Failing."
          else
            echo "babysit-pr failed on final retry attempt (not a rate limit)."
            echo "$babysit_output"
          fi
          exit 1
